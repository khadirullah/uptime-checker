services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime}
      POSTGRES_DB: ${POSTGRES_DB:-uptime}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"   # for running api or worker outside docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uptime} -d ${POSTGRES_DB:-uptime}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"   # for running api or worker outside docker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # runs every file in db/migrations in name order, then exits.
  # api and worker wait for it to finish successfully.
  migrate:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-uptime}
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "applying $$f"
          psql -h postgres -U ${POSTGRES_USER:-uptime} -d ${POSTGRES_DB:-uptime} -v ON_ERROR_STOP=1 -f "$$f"
        done
    restart: "no"

  api:
    build: ./api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime}@postgres:5432/${POSTGRES_DB:-uptime}
      REDIS_URL: redis://redis:6379/0
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
    ports:
      - "8000:8000"

  worker:
    build: ./worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime}@postgres:5432/${POSTGRES_DB:-uptime}
      REDIS_URL: redis://redis:6379/0
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
