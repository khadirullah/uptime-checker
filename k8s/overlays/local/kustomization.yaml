apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# the local loop gets its own namespace and nodeport, so it can run next to the release
# overlay that argocd deploys into `uptime` on the same cluster. kustomize renames the
# Namespace object from the base as well as stamping every resource, and the generated
# Secret below needs the field too or it lands in default.
namespace: uptime-dev

resources:
  - ../../base

patches:
  - patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081   # kind maps this to localhost:8082, see kind-config.yaml
    target:
      kind: Service
      name: web

# images built locally with `make build` and copied into the kind node with `make load`
images:
  - name: uptime-checker/api
    newTag: dev
  - name: uptime-checker/worker
    newTag: dev
  - name: uptime-checker/web
    newTag: dev
  - name: uptime-checker/migrate
    newTag: dev

# the database password for this cluster, read from secret.env, which is gitignored.
# `make deploy` creates it from secret.env.example the first time. a plain Secret is fine
# here: kind clusters are thrown away, so sealing against one of them would protect nothing.
secretGenerator:
  - name: uptime-db
    envs:
      - secret.env
    options:
      disableNameSuffixHash: true   # pods reference the name directly
