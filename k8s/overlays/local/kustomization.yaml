apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# the base sets this too, but only for its own resources. the Secret generated below
# needs it here or it lands in default.
namespace: uptime

resources:
  - ../../base

# images built locally with `make build` and copied into the kind node with `make load`
images:
  - name: uptime-checker/api
    newTag: dev
  - name: uptime-checker/worker
    newTag: dev
  - name: uptime-checker/web
    newTag: dev
  - name: uptime-checker/migrate
    newTag: dev

# the database password for this cluster, read from secret.env, which is gitignored.
# `make deploy` creates it from secret.env.example the first time. a plain Secret is fine
# here: kind clusters are thrown away, so sealing against one of them would protect nothing.
secretGenerator:
  - name: uptime-db
    envs:
      - secret.env
    options:
      disableNameSuffixHash: true   # pods reference the name directly
