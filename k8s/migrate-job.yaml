# applies db/migrations against postgres, once per deploy.
# the sql is idempotent (IF NOT EXISTS), so re-running is safe. a Job is immutable, so
# `make deploy` deletes the previous one before applying; argocd does the same with a hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # postgres user in the alpine image
      containers:
        - name: migrate
          image: uptime-checker/migrate:dev
          envFrom:
            - configMapRef:
                name: uptime-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-db
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
