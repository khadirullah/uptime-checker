# non-secret settings shared by the services.
# the same names as .env.example, plus POSTGRES_HOST and REDIS_URL, which compose builds
# inline. compose and kubernetes read one vocabulary.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-config
data:
  POSTGRES_USER: uptime
  POSTGRES_DB: uptime
  POSTGRES_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  CHECK_INTERVAL_SECONDS: "60"
  HTTP_TIMEOUT_SECONDS: "10"
